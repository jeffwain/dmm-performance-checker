# Publishing a GitHub release (tag it like v1.2.3) builds the module and
# attaches module.json and module.zip to that release. Foundry installs and
# updates from the manifest URL; nothing is sent to foundryvtt.com.
#
# Publish from the GitHub UI, or from a terminal with npm run release.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Passed through env, not ${{ }} in scripts, so a tag name can't inject shell.
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - run: if [ -f package-lock.json ]; then npm ci; fi

      - run: npm run verify --if-present

      - run: npm run build -- "$TAG"

      - name: Zip the package
        run: cd dist/package && zip -r ../module.zip .

      - name: Attach to the release
        run: gh release upload "$TAG" dist/module.json dist/module.zip --clobber

      # Manifest stays on "latest" so installed copies keep finding updates;
      # "This version" pins this release directly. npm run release leaves a
      # <!-- manifest --> marker below your own notes; without one (a release
      # made on GitHub) the link goes at the top. Skipped if the notes already
      # have it, so re-running the job doesn't repeat it.
      - name: Add the manifest link to the release notes
        run: |
          latest_url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/module.json"
          version_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/module.json"
          link=$(printf '**Manifest:** %s\n\n**This version:** %s' "$latest_url" "$version_url")
          marker="<!-- manifest -->"
          body=$(gh release view "$TAG" --json body --jq .body)
          case "$body" in
            *"$latest_url"*) exit 0 ;;
            *"$marker"*) notes="${body/"$marker"/$link}" ;;
            *) notes=$(printf '%s\n\n%s' "$link" "$body") ;;
          esac
          gh release edit "$TAG" --notes "$notes"
